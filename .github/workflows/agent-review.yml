name: Agent — Review A Pull Request

# WHAT TRIGGERS IT
#   A trusted author puts the `agent:review` label on a pull request from this
#   repository: a person with write access, or the factory's own App (the
#   implementer adds it to every PR it opens). Add it by hand to review again,
#   or when that hand-off failed. Every other label starts a run named "not a
#   trigger label" whose jobs all skip. A PR from a fork gets no secrets, so
#   its gate run fails at its first token: the factory never reviews a
#   stranger's code with a writable token.
#
# WHAT IT DOES
#   Review is two Actions runs, and this entry file starts the first.
#
#   1. The gate run (gate-run.yml, a few seconds, no agent). It pins the
#      factory commit the whole task will use (`main` here: the factory repo
#      runs @main; other repos run @stable), reads budget.yml from main, and
#      re-reads the PR with its own App token. Then, in this order:
#        - the label is missing, or no trusted author applied it: it ends
#          quietly and touches nothing;
#        - a budget pause is open: `factory:paused`;
#        - today's agent runs reach `daily_runs`, or the agent runs in flight
#          reach `concurrent_runs`: `factory:queued`;
#        - an earlier run holds the PR's lock: `factory:queued`. A second
#          `agent:review` on a PR under review therefore queues, never drops;
#        - otherwise it writes the marker, swaps `agent:review` for
#          `agent:in-progress`, and starts the agent run by workflow_dispatch
#          (review-agent.yml), passing the pinned commit, the PR and the job
#          timeout. The requeue run restarts queued and paused PRs.
#
#   2. The agent run (review-agent.yml, which calls review-agent-run.yml at
#      @stable or @main). It is cold and memory-less: it shares nothing with
#      the run that built the change, and starts from a fresh checkout of the
#      PR's head and three primary sources it fetches itself — the diff
#      against the base as it is now, CODING_STANDARDS.md, and the ticket the
#      PR closes (read from the ticket, not the PR description; with no
#      `Closes #n` the Spec axis says "no spec available"). An implementer
#      that argued itself into a shortcut would argue a reviewer sharing its
#      context into the same one; resist passing context in.
#      The agent (.sandcastle/agent-workflows/review/) runs under bwrap()
#      behind the credential relay, with the model and ceiling budget.yml
#      gives review. It fixes every finding the rules decide, one commit per
#      fix, and leaves the rest as inline comments. The push guard scans its
#      commits for the Claude token, gitleaks findings and workflow changes.
#        - Clean: the fixes are pushed to the PR's branch, never forced. If
#          the branch moved during the run, the push is rejected and the fixes
#          go to `<pr branch>-<run id>`, opened as a draft PR against the same
#          base, and the original PR gets `agent:blocked`: keep one of the two.
#        - The verdict is posted as a comment, the inline comments as one
#          review, and the PR is marked ready once a real verdict exists, pass
#          or fail. Ready is not approved: a human merges.
#        - Ceiling hit, crash or refused push: whatever is safe is pushed, the
#          PR stays a draft, it gets `agent:blocked` with a comment.
#        - A Claude limit: nothing is pushed, the PR goes `factory:paused`
#          (not a try), and the budget-pause ticket is opened or commented on;
#          the requeue run restarts it.
#      Its job timeout is `agent_minutes` + 15; if that fires, something hung.
#      Its last job, however the run ended, starts the requeue run
#      (requeue.yml) by workflow_dispatch, with an App token that may only
#      start runs.
#
#   Locks come from run names, never from Actions concurrency groups: the gate
#   run is `[pr owner/repo#<n>] review (no agent)`, the agent run
#   `[pr owner/repo#<n>] review`. Every run writes a run summary. To retry a
#   blocked PR, re-add `agent:review`.
#
# WHAT IT NEEDS
#   vars.FACTORY_APP_ID and secrets.FACTORY_APP_PRIVATE_KEY — the factory's
#     GitHub App, installed on this repository. Each host step that talks to
#     GitHub mints its own token for this one repository with only the
#     permissions that step needs. The App never holds Workflows,
#     Administration, Secrets or Variables.
#   secrets.CLAUDE_CODE_OAUTH_TOKEN — the Claude token. Only the relay's host
#     step reads it.
#   budget.yml on main; a `stable` tag (both refs are named in every entry
#     file); the labels, created once: see the README.
#
# A CAUTION THAT COMES WITH IT
#   `pull_request` (not `pull_request_target`), so a fork's PR never runs with
#   secrets. Do not change that.

on:
  pull_request:
    types: [labeled]

run-name: ${{ github.event.label.name == 'agent:review' && format('[pr {0}#{1}] review (no agent)', github.repository, github.event.pull_request.number) || 'not a trigger label' }}

permissions:
  contents: read

jobs:
  gate-stable:
    if: github.event.label.name == 'agent:review' && github.repository != 'ShreyasReddy77/my-software-factory'
    uses: ShreyasReddy77/my-software-factory/.github/workflows/gate-run.yml@stable
    with:
      factory_ref: stable
      task: review
      item: ${{ github.event.pull_request.number }}
      agent_workflow: review-agent.yml
    secrets:
      FACTORY_APP_PRIVATE_KEY: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}

  gate-main:
    if: github.event.label.name == 'agent:review' && github.repository == 'ShreyasReddy77/my-software-factory'
    uses: ShreyasReddy77/my-software-factory/.github/workflows/gate-run.yml@main
    with:
      factory_ref: main
      task: review
      item: ${{ github.event.pull_request.number }}
      agent_workflow: review-agent.yml
    secrets:
      FACTORY_APP_PRIVATE_KEY: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
