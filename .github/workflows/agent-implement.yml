name: Agent — Implement A Ticket

# WHAT TRIGGERS IT
#   A trusted author puts the `agent:implement` label on an issue: a person
#   with write access, or the factory's own App (explore, the requeue run).
#   That is the whole interface. Every other label on every other issue starts
#   a run named "not a trigger label" whose jobs all skip.
#
# WHAT IT DOES
#   Implement is two Actions runs, and this entry file starts the first.
#
#   1. The gate run (gate-run.yml, a few seconds, no agent). It pins the
#      factory commit the whole task will use (`main` here: the factory repo
#      runs @main; other repos run @stable), reads budget.yml from main, and
#      re-reads the ticket with its own App token. Then, in this order:
#        - the label is missing, or no trusted author applied it: it ends
#          quietly and touches nothing;
#        - a budget pause is open: `factory:paused`;
#        - today's agent runs (since midnight UTC) reach `daily_runs`, or the
#          agent runs in flight reach `concurrent_runs`: `factory:queued`;
#        - an earlier run holds the ticket's lock: `factory:queued`;
#        - otherwise it proceeds.
#      Queued and paused tickets carry a hidden marker comment naming the
#      label they restart as, and the requeue run restarts them. A third label
#      on a busy ticket therefore queues; it is never dropped. On proceed the
#      gate run writes the marker, swaps `agent:implement` for
#      `agent:in-progress`, and starts the agent run by workflow_dispatch,
#      passing the pinned commit, the ticket and the job timeout.
#
#   2. The agent run (implement-agent.yml, which calls implement-agent-run.yml
#      at the ref the gate run passed). It checks the factory out at the
#      pinned commit, starts the credential relay, and runs the implement
#      agent (.sandcastle/agent-workflows/implement/) under bwrap() with the
#      model and ceiling budget.yml gives implement. The agent commits; it
#      holds no GitHub credential and never the Claude token. The push guard
#      then scans the agent's new commits for the Claude token, for gitleaks
#      findings and for any change under .github/workflows/.
#        - Built and clean: it pushes `agent/issue-<n>-<run id>`, opens a
#          DRAFT pull request that closes the ticket, and adds `agent:review`
#          to hand it to the reviewer. A human merges.
#        - Ceiling hit (`max_turns` or `agent_minutes`): it pushes what was
#          committed as a draft, comments, and sets `agent:blocked`.
#        - Refused by the push guard, crashed, or nothing committed: it
#          pushes nothing, comments why, and sets `agent:blocked`.
#      Its job timeout is `agent_minutes` + 15; if that fires, something hung.
#      Its last job, however the run ended, starts the requeue run
#      (requeue.yml) by workflow_dispatch, with an App token that may only
#      start runs.
#
#   Locks come from run names, never from Actions concurrency groups: the
#   gate run is named `[ticket owner/repo#<n>] implement (no agent)` and the
#   agent run `[ticket owner/repo#<n>] implement`. Every run writes a run
#   summary. To retry a blocked ticket, re-add `agent:implement`.
#
# WHAT IT NEEDS
#   vars.FACTORY_APP_ID and secrets.FACTORY_APP_PRIVATE_KEY — the factory's
#     GitHub App, installed on this repository. Each host step that talks to
#     GitHub mints its own token for this one repository with only the
#     permissions that step needs, and the token is revoked when the job ends.
#     The App never holds Workflows, Administration, Secrets or Variables.
#   secrets.CLAUDE_CODE_OAUTH_TOKEN — the Claude token: a subscription token
#     or an API key, as budget.yml's credential says. Only the relay's host
#     step reads it.
#   budget.yml on main — the model, credential, caps and ceilings.
#   A `stable` tag — every entry file names the @stable gate run too, so the
#     tag must exist even while this repository runs @main.
#   The labels, created once: see the README.
#
# A CAUTION THAT COMES WITH IT
#   `issues: labeled` fires on issues, which cannot come from a fork. Do not
#   copy this trigger onto `pull_request_target`.

on:
  issues:
    types: [labeled]

run-name: ${{ github.event.label.name == 'agent:implement' && format('[ticket {0}#{1}] implement (no agent)', github.repository, github.event.issue.number) || 'not a trigger label' }}

permissions:
  contents: read

jobs:
  gate-stable:
    if: github.event.label.name == 'agent:implement' && github.repository != 'ShreyasReddy77/my-software-factory'
    uses: ShreyasReddy77/my-software-factory/.github/workflows/gate-run.yml@stable
    with:
      factory_ref: stable
      task: implement
      item: ${{ github.event.issue.number }}
      agent_workflow: implement-agent.yml
    secrets:
      FACTORY_APP_PRIVATE_KEY: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}

  gate-main:
    if: github.event.label.name == 'agent:implement' && github.repository == 'ShreyasReddy77/my-software-factory'
    uses: ShreyasReddy77/my-software-factory/.github/workflows/gate-run.yml@main
    with:
      factory_ref: main
      task: implement
      item: ${{ github.event.issue.number }}
      agent_workflow: implement-agent.yml
    secrets:
      FACTORY_APP_PRIVATE_KEY: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
