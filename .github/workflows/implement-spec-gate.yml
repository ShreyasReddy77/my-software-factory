name: Implement-spec — gate run

# Called by agent-implement-spec.yml at @stable or @main. Its header is the
# operator's manual for the whole task; this file is its gate run.

on:
  workflow_call:
    inputs:
      factory_ref:
        description: stable or main, the factory ref this task runs
        type: string
        required: true
    secrets:
      FACTORY_APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read

env:
  FACTORY_REPO: ShreyasReddy77/my-software-factory

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the factory at the ref this task runs
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FACTORY_REPO }}
          ref: ${{ inputs.factory_ref }}
          path: factory
          persist-credentials: false

      - name: Pin the factory commit
        id: pin
        run: echo "sha=$(git -C factory rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Read budget.yml from main
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FACTORY_REPO }}
          ref: main
          path: settings
          sparse-checkout: budget.yml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Use main's budget.yml
        run: cp settings/budget.yml factory/budget.yml

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: factory/.sandcastle/package-lock.json

      - name: Install the factory's dependencies
        run: npm ci --prefix factory/.sandcastle

      - name: Mint the gate run's token
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: write
          permission-actions: write

      - name: Gate the spec, then split it or build its next ready ticket
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          TARGET_REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          FACTORY_REF: ${{ inputs.factory_ref }}
          FACTORY_SHA: ${{ steps.pin.outputs.sha }}
          AGENT_WORKFLOW: agent-implement-spec-run.yml
          FACTORY_APP_SLUG: ${{ steps.token.outputs.app-slug }}
        run: factory/.sandcastle/node_modules/.bin/tsx factory/.sandcastle/agent-workflows/implement-spec/gate-run.ts
