name: Agent — Explore The Tickets

# WHAT TRIGGERS IT
#   A trusted author puts the `agent:explore` label on an issue: a person with
#   write access, or the factory's own App. Every other label starts a run
#   named "not a trigger label" whose jobs all skip.
#
# WHAT IT DOES
#   Explore is the cheap, read-only run before implementation, and it works a
#   batch: every open issue a trusted author labelled `agent:explore` (up to
#   100, oldest first), together. Tickets arrive in clumps with duplicates in
#   them; one run over the batch reads every ticket first, groups the related
#   ones, explores each group once, and closes duplicates onto the oldest.
#   It is two Actions runs, and this entry file starts the first.
#
#   1. The gate run (gate-run.yml, a few seconds, no agent). It pins the
#      factory commit (`main` here; other repos run @stable), reads budget.yml
#      from main, and re-reads the labelled issue with its own App token:
#        - the label is missing, or no trusted author applied it: it ends
#          quietly and touches nothing;
#        - a budget pause is open: `factory:paused`;
#        - today's agent runs reach `daily_runs`, or the agent runs in flight
#          reach `concurrent_runs`: `factory:queued`;
#        - an explore batch is already running on this repo (the per-repo
#          lock): `factory:queued`. Only the labelled issue queues; the rest
#          keep `agent:explore` and join whichever batch runs next;
#        - otherwise it lists the batch in one call, keeps the issues whose
#          `agent:explore` a trusted author applied, swaps `agent:explore` for
#          `agent:in-progress` on all of them in one call, and starts one agent
#          run (explore-agent.yml) by workflow_dispatch with the batch. The
#          whole batch is one agent run against the daily cap.
#
#   2. The agent run (explore-agent.yml, which calls explore-agent-run.yml at
#      @stable or @main), three jobs:
#        explore  writes the batch (titles, bodies, trusted comments) to a file
#                 and runs the agent (.sandcastle/agent-workflows/explore/)
#                 under bwrap() behind the credential relay, with explore's
#                 model and ceiling. It holds no GitHub token, and its plan —
#                 one tag and comment per issue — is its only output.
#        apply    runs no agent. It checks the plan: every batch issue exactly
#                 once, a known tag (a closed enum in plan-schema.ts), a
#                 comment, and duplicates pointing at a surviving issue. A plan
#                 that breaks any rule is refused whole: nothing is written.
#                 Otherwise, with an Issues-only App token, survivors first:
#                   easy-call     → comment, `agent:implement` (the factory
#                                   keeps going without being asked)
#                   anything else → comment, `needs-a-human`
#                   a duplicate   → comment, closed as a duplicate
#        finish   however the run ended: marks every issue still
#                 `agent:in-progress` `agent:blocked` with a comment if any job
#                 failed (a refused plan, a crash, a ceiling), takes
#                 `agent:in-progress` off, and writes the run summary.
#      Its job timeout is `agent_minutes` + 15; if that fires, something hung.
#
#   Locks come from run names, never from Actions concurrency groups: the gate
#   run is `[repo owner/repo] explore (no agent)`, the agent run
#   `[repo owner/repo] explore`. Every run writes a run summary. To retry a
#   blocked issue, re-add `agent:explore`.
#
# WHAT IT NEEDS
#   vars.FACTORY_APP_ID and secrets.FACTORY_APP_PRIVATE_KEY — the factory's
#     GitHub App, installed on this repository. Each host step that talks to
#     GitHub mints its own token for this one repository with only the
#     permissions that step needs. A label the App applies starts the next
#     workflow, which is how `agent:implement` hands an easy call on. The App
#     never holds Workflows, Administration, Secrets or Variables.
#   secrets.CLAUDE_CODE_OAUTH_TOKEN — the Claude token. Only the relay's host
#     step reads it.
#   budget.yml on main; a `stable` tag (both refs are named in every entry
#     file); the labels, created once, `needs-a-human` among them: see
#     docs/setup-checklist.md.

on:
  issues:
    types: [labeled]

run-name: ${{ github.event.label.name == 'agent:explore' && format('[repo {0}] explore (no agent)', github.repository) || 'not a trigger label' }}

permissions:
  contents: read

jobs:
  gate-stable:
    if: github.event.label.name == 'agent:explore' && github.repository != 'ShreyasReddy77/my-software-factory'
    uses: ShreyasReddy77/my-software-factory/.github/workflows/gate-run.yml@stable
    with:
      factory_ref: stable
      task: explore
      item: ${{ github.event.issue.number }}
      agent_workflow: explore-agent.yml
    secrets:
      FACTORY_APP_PRIVATE_KEY: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}

  gate-main:
    if: github.event.label.name == 'agent:explore' && github.repository == 'ShreyasReddy77/my-software-factory'
    uses: ShreyasReddy77/my-software-factory/.github/workflows/gate-run.yml@main
    with:
      factory_ref: main
      task: explore
      item: ${{ github.event.issue.number }}
      agent_workflow: explore-agent.yml
    secrets:
      FACTORY_APP_PRIVATE_KEY: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
