name: Implement — agent run job

# Called by implement-agent.yml at @stable or @main. agent-implement.yml's
# header is the operator's manual for the whole task; this file is its agent
# run's jobs.

on:
  workflow_call:
    inputs:
      factory_sha:
        type: string
        required: true
      issue:
        type: string
        required: true
      job_timeout:
        type: string
        required: true
    secrets:
      FACTORY_APP_PRIVATE_KEY:
        required: true
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

permissions:
  contents: read

env:
  FACTORY_REPO: ShreyasReddy77/my-software-factory

jobs:
  agent:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ fromJSON(inputs.job_timeout) }}
    env:
      TARGET_REPO: ${{ github.repository }}
      ISSUE: ${{ inputs.issue }}
      BRANCH: agent/issue-${{ inputs.issue }}-${{ github.run_id }}
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Check out the factory at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FACTORY_REPO }}
          ref: ${{ inputs.factory_sha }}
          path: factory
          persist-credentials: false

      - name: Check out the target repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the factory and the sandbox
        uses: ./factory/.github/actions/setup-factory
        with:
          factory-repo: ${{ env.FACTORY_REPO }}
          agent: "true"

      - name: Mint the ticket reader's token
        id: read-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: read

      - name: Read the ticket and the App's git identity
        id: ticket
        env:
          GH_TOKEN: ${{ steps.read-token.outputs.token }}
          FACTORY_APP_SLUG: ${{ steps.read-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          factory/.sandcastle/node_modules/.bin/tsx factory/.sandcastle/agent-workflows/shared/read-ticket.ts
          echo "bot-id=$(gh api "users/${FACTORY_APP_SLUG}%5Bbot%5D" --jq .id)" >> "$GITHUB_OUTPUT"

      - name: Open the branch
        id: branch
        working-directory: target
        env:
          FACTORY_APP_SLUG: ${{ steps.read-token.outputs.app-slug }}
          BOT_ID: ${{ steps.ticket.outputs.bot-id }}
        run: |
          set -euo pipefail
          git config user.name "${FACTORY_APP_SLUG}[bot]"
          git config user.email "${BOT_ID}+${FACTORY_APP_SLUG}[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Start the credential relay
        id: relay
        env:
          CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: factory/.sandcastle/agent-workflows/shared/start-relay.sh

      - name: Build the ticket
        working-directory: target
        run: ../factory/.sandcastle/node_modules/.bin/tsx ../factory/.sandcastle/agent-workflows/implement/implement.ts

      - name: Scan the agent's commits with the push guard
        env:
          REPO_DIR: target
          PUSH_BASE: ${{ steps.branch.outputs.base }}
          PUSH_HEAD: HEAD
          CLAUDE_TOKEN_SHA256: ${{ steps.relay.outputs.claude-token-sha256 }}
        run: factory/.sandcastle/node_modules/.bin/tsx factory/.sandcastle/agent-workflows/shared/guard-push.ts

      - name: Decide whether to push
        id: decide
        env:
          REPO_DIR: target
          PUSH_BASE: ${{ steps.branch.outputs.base }}
        run: factory/.sandcastle/node_modules/.bin/tsx factory/.sandcastle/agent-workflows/shared/decide-build-end.ts

      - name: Mint the pusher's token
        id: push-token
        if: steps.decide.outputs.push == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Push
        if: steps.decide.outputs.push == 'true'
        working-directory: target
        env:
          GH_TOKEN: ${{ steps.push-token.outputs.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c core.hooksPath=/dev/null \
            -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push "https://github.com/${TARGET_REPO}.git" "HEAD:refs/heads/${BRANCH}"

      - name: Mint the pull request's token
        id: pr-token
        if: steps.decide.outputs.push == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-pull-requests: write
          permission-issues: write

      - name: Open the draft pull request and hand it to review
        id: pr
        if: steps.decide.outputs.push == 'true'
        env:
          GH_TOKEN: ${{ steps.pr-token.outputs.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HAND_OFF_LABEL: ${{ steps.decide.outputs.handoff-label }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/pr-body.md"
          if [ -s "$AGENT_IO_DIR/pr-body.md" ]; then cp "$AGENT_IO_DIR/pr-body.md" "$body"; else echo "Built by the implementer workflow." > "$body"; fi
          printf '\n---\n\nCloses #%s. Built unattended by [this run](%s).\n' "$ISSUE" "$RUN_URL" >> "$body"
          title="$(gh issue view "$ISSUE" --repo "$TARGET_REPO" --json title --jq .title)"
          url="$(gh pr create --draft --repo "$TARGET_REPO" --base "$DEFAULT_BRANCH" --head "$BRANCH" \
            --title "$title" --body-file "$body")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          if [ -n "$HAND_OFF_LABEL" ]; then
            gh pr edit "$url" --add-label "$HAND_OFF_LABEL"
            echo "handed-off=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint the reporter's token
        id: report-token
        if: always()
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: write

      - name: Report back on the ticket
        if: always()
        env:
          GH_TOKEN: ${{ steps.report-token.outputs.token }}
          FACTORY_APP_SLUG: ${{ steps.report-token.outputs.app-slug }}
          JOB_STATUS: ${{ job.status }}
          PR_URL: ${{ steps.pr.outputs.url }}
          HANDED_OFF: ${{ steps.pr.outputs.handed-off }}
        run: factory/.sandcastle/node_modules/.bin/tsx factory/.sandcastle/agent-workflows/implement/report.ts

  requeue:
    needs: agent
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Mint the requeue starter's token
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          owner: ShreyasReddy77
          repositories: my-software-factory
          permission-actions: write

      - name: Start the requeue run
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: gh workflow run requeue.yml --repo "$FACTORY_REPO" --ref main -f finishing_run_id="$GITHUB_RUN_ID"
