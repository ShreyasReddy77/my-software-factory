name: Agent — Implement A Spec

# WHAT TRIGGERS IT
#   A trusted author puts the `agent:implement-spec` label on a spec issue: a
#   person with write access, or the factory's own App (the requeue run).
#   That is the whole interface. There is no clock, no dispatch button and no
#   self-start chain: each label does exactly one thing, then stops. Every
#   other label on every other issue starts a run named "not a trigger label"
#   whose jobs all skip.
#
# WHAT IT DOES
#   Implement-spec is two Actions runs, and this entry file starts the first.
#
#   1. The gate run (implement-spec-gate.yml, a few seconds, no agent). It
#      pins the factory commit the whole task will use (`main` here: the
#      factory repo runs @main; other repos run @stable), reads budget.yml
#      from main, and re-reads the spec with its own App token. Then, in
#      this order:
#        - the label is missing, or no trusted author applied it: it ends
#          quietly and touches nothing;
#        - a budget pause is open: `factory:paused`;
#        - today's agent runs reach `daily_runs`, or the agent runs in flight
#          reach `concurrent_runs`: `factory:queued`;
#        - an earlier run holds the spec's lock: `factory:queued`. A second
#          label on a spec whose split or gate run is still going queues;
#        - otherwise it reads the spec's queue, the issues labelled
#          `spec:<n>`, and does one of four things:
#            * no queue yet: it claims the spec and starts the SPLIT;
#            * a ready ticket (the lowest open `Position:` whose `Depends on:`
#              positions are all closed, and that no run holds, parks or
#              queues): if an earlier run holds that ticket's lock it queues
#              the spec; otherwise it claims the ticket and starts its BUILD;
#            * every ticket closed: it says the queue is drained;
#            * open tickets but none ready: it names them.
#          The last two take the label off and start nothing.
#      Queued and paused specs carry a hidden marker comment naming the label
#      they restart as, and the requeue run restarts them.
#
#   2. The agent run (agent-implement-spec-run.yml, which calls
#      implement-spec-agent.yml at the same ref). It checks the factory out at
#      the pinned commit, starts the credential relay, and runs an agent
#      under bwrap(). The agent holds no GitHub credential and never the
#      Claude token.
#        - SPLIT, on implement-spec's line in budget.yml, under the spec's
#          lock: the agent reads the spec and answers with an ordered queue;
#          a host step writes it as issues labelled `spec:<n>` with
#          `Position:` and `Depends on:` lines, and comments on the spec. It
#          writes no code and pushes nothing. Review and edit the queue, then
#          re-add the label to build the first ready ticket.
#        - BUILD, on implement's line in budget.yml, under the ticket's lock:
#          exactly implement's agent run, with the spec as context. The push
#          guard scans the agent's commits; built and clean, it pushes
#          `agent/issue-<n>-<run id>`, opens a DRAFT pull request, adds
#          `agent:review`, and closes the ticket so the queue moves on. A
#          ceiling hit pushes a draft and parks the ticket; a refusal, crash
#          or empty run pushes nothing and parks it with `agent:blocked`. A
#          parked ticket is skipped until a person takes `agent:blocked` off.
#      A Claude usage limit or empty credit in either mode pushes nothing,
#      is not a try, frees any claimed ticket, labels the spec
#      `factory:paused` and records the budget-pause ticket; the requeue run
#      restarts the spec. Its job timeout is the line's `agent_minutes` + 15.
#      Its last job, however the run ended, starts the requeue run
#      (requeue.yml) by workflow_dispatch, with an App token that may only
#      start runs.
#
#   Locks come from run names, never from Actions concurrency groups: the
#   gate run is named `[ticket owner/repo#<spec>] implement-spec (no agent)`
#   and the agent run `[ticket owner/repo#<n>] implement-spec`, where <n> is
#   the spec for a split and the ticket for a build. Every run writes a run
#   summary. To retry a parked spec or ticket, take `agent:blocked` off and
#   re-add `agent:implement-spec` to the spec.
#
# WHAT IT NEEDS
#   vars.FACTORY_APP_ID and secrets.FACTORY_APP_PRIVATE_KEY — the factory's
#     GitHub App, installed on this repository. Each host step that talks to
#     GitHub mints its own token for this one repository with only the
#     permissions that step needs, and the token is revoked when the job ends.
#     The App never holds Workflows, Administration, Secrets or Variables.
#   secrets.CLAUDE_CODE_OAUTH_TOKEN — the Claude token: a subscription token
#     or an API key, as budget.yml's credential says. Only the relay's host
#     step reads it.
#   budget.yml on main — the models, credential, caps and ceilings.
#   A `stable` tag — every entry file names its reusable workflow at @stable
#     too, so the tag must exist even while this repository runs @main.
#   The labels, created once: see docs/setup-checklist.md. The split creates
#     each spec's `spec:<n>` label itself.
#
# A CAUTION THAT COMES WITH IT
#   `issues: labeled` fires on issues, which cannot come from a fork. Do not
#   copy this trigger onto `pull_request_target`.

on:
  issues:
    types: [labeled]

run-name: ${{ github.event.label.name == 'agent:implement-spec' && format('[ticket {0}#{1}] implement-spec (no agent)', github.repository, github.event.issue.number) || 'not a trigger label' }}

permissions:
  contents: read

jobs:
  gate-stable:
    if: github.event.label.name == 'agent:implement-spec' && github.repository != 'ShreyasReddy77/my-software-factory'
    uses: ShreyasReddy77/my-software-factory/.github/workflows/implement-spec-gate.yml@stable
    with:
      factory_ref: stable
    secrets:
      FACTORY_APP_PRIVATE_KEY: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}

  gate-main:
    if: github.event.label.name == 'agent:implement-spec' && github.repository == 'ShreyasReddy77/my-software-factory'
    uses: ShreyasReddy77/my-software-factory/.github/workflows/implement-spec-gate.yml@main
    with:
      factory_ref: main
    secrets:
      FACTORY_APP_PRIVATE_KEY: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
